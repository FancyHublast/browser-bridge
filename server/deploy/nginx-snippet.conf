# ─────────────────────────────────────────────────────────────────────
# browser-bridge 的 nginx 反代片段（wss 终止）
#
# 放到 /etc/nginx/conf.d/ 或站点的 server {} 里。
# 作用：把 wss://bridge.yourcompany.com/u/<用户名>/ 转到本机对应的实例端口，
#       每个用户一个实例（服务端是单客户端设计，见 docs/内部分发与部署.md 4.1）。
#
# 证书：用 Let's Encrypt 最省事（DNS 验证即可，不必开公网 80/443 给所有人）。
#      如果用内网 CA 自签，必须把 CA 根证书装进每个客户端的「受信任的根证书颁发机构」，
#      否则扩展的 service worker 会直接拒绝这个 wss 连接。
# ─────────────────────────────────────────────────────────────────────

# WebSocket 升级需要透传这两个头。map 放 http {} 层级，只能定义一次。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bridge.yourcompany.com;

    ssl_certificate     /etc/letsencrypt/live/bridge.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bridge.yourcompany.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ── 例：张三 → 本机 8765 ──
    location /u/zhangsan {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # WebSocket 是长连接，默认 60s 会把空闲连接掐断，
        # 表现为扩展"每隔一会儿掉线又重连"。这里放到 1 小时。
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── 例：李四 → 本机 8766（照抄改端口即可）──
    location /u/lisi {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── 扩展的私有更新分发（场景：企业策略静默安装）──
    # 只在内网提供即可，不必暴露公网。
    location /updates/ {
        root /var/www;
        autoindex off;
        # 只允许公司网段拉取更新包（换成你自己的网段）
        # allow 10.0.0.0/8;
        # deny  all;
    }

    # ── 可选：MCP 的 HTTP 端点 ──
    # ⚠️ 只有在确实需要「远程 agent 直连服务器」时才开这一段。
    # 这个端点等于浏览器控制权，务必叠加认证（mTLS / Basic Auth / IP 白名单），
    # 三层里至少落一层，否则内网任何一台机器扫到端口就能接管别人的浏览器。
    # location /mcp/ {
    #     proxy_pass http://127.0.0.1:8766;
    #     auth_basic           "browser-bridge";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     allow 10.1.0.0/16;
    #     deny  all;
    # }
}

# 顺手把 80 跳 443，避免有人误用明文 http
server {
    listen 80;
    server_name bridge.yourcompany.com;
    return 301 https://$host$request_uri;
}
